# Local, 3-node KRaft Kafka cluster for WP-07 (replication, ISR, and broker
# failure). See platform/kafka-cluster/README.md for a full explanation of
# every value below.
#
# This is a SEPARATE environment from platform/kafka/ (the WP-02 single-node
# cluster every earlier lab uses) -- different container names, different
# network, different volumes, different host ports (9093-9095, leaving 9092
# free). Both can run at the same time without conflicting, and starting
# this one never touches or requires stopping the WP-02 environment.
#
# All three nodes combine the broker and controller roles, exactly like the
# WP-02 single-node setup does -- this WP is about DATA-PLANE replication
# and broker failure, not controller-quorum failure (that's WP-08's
# dedicated topic). Three combined nodes happen to form a real 3-voter
# controller quorum as a side effect, but that quorum's own failure modes
# are not this lab's subject.

services:
  kafka-broker-1:
    image: apache/kafka:4.3.1
    container_name: kafka-broker-1
    hostname: kafka-broker-1
    ports:
      - "9093:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092"
      # Each broker's PLAINTEXT_HOST advertised address uses ITS OWN
      # published host port -- a client on your machine connecting to
      # localhost:9093 must be told "localhost:9093" back, not one of the
      # other two brokers' ports. See platform/kafka-cluster/README.md,
      # "Why three different host ports," for what breaks if this is wrong.
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://localhost:9093,PLAINTEXT://kafka-broker-1:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      # All three nodes list all three voters, by their Docker network
      # hostnames (not host-published ports -- this traffic never leaves
      # the Docker network). Identical on every node; this is the metadata
      # quorum's membership list, not a per-node setting.
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-broker-1:29093,2@kafka-broker-2:29093,3@kafka-broker-3:29093"
      # Every node in ONE cluster must share the same cluster ID -- this is
      # what makes them one cluster instead of three unrelated single-node
      # ones. Generated for real with `kafka-storage.sh random-uuid` against
      # the pinned apache/kafka:4.3.1 image (not copied from a tutorial);
      # not a secret, but also not meaningful to reuse outside this lab.
      CLUSTER_ID: "K2cByfqsRAO_ktpfonxKLw"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      # With three real brokers, these internal topics can finally use a
      # genuine replication factor instead of WP-02's forced RF=1 -- see
      # platform/kafka-cluster/README.md for why 3/2 (not 3/3) is used here.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_OFFSETS_TOPIC_MIN_ISR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-broker-1-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-broker-2:
    image: apache/kafka:4.3.1
    container_name: kafka-broker-2
    hostname: kafka-broker-2
    ports:
      - "9094:9092"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://localhost:9094,PLAINTEXT://kafka-broker-2:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-broker-1:29093,2@kafka-broker-2:29093,3@kafka-broker-3:29093"
      CLUSTER_ID: "K2cByfqsRAO_ktpfonxKLw"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_OFFSETS_TOPIC_MIN_ISR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-broker-2-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-broker-3:
    image: apache/kafka:4.3.1
    container_name: kafka-broker-3
    hostname: kafka-broker-3
    ports:
      - "9095:9092"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://localhost:9095,PLAINTEXT://kafka-broker-3:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-broker-1:29093,2@kafka-broker-2:29093,3@kafka-broker-3:29093"
      CLUSTER_ID: "K2cByfqsRAO_ktpfonxKLw"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_OFFSETS_TOPIC_MIN_ISR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-broker-3-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  kafka-broker-1-data:
    name: kafka-principal-engineer-lab_kafka-broker-1-data
  kafka-broker-2-data:
    name: kafka-principal-engineer-lab_kafka-broker-2-data
  kafka-broker-3-data:
    name: kafka-principal-engineer-lab_kafka-broker-3-data
