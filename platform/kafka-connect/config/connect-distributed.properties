# Kafka Connect distributed-mode worker configuration for WP-11.
# See platform/kafka-connect/README.md for a full explanation of every
# value below.

# Internal PLAINTEXT listener of the reused WP-07 3-broker cluster --
# same "use the internal listener for anything inside the Docker
# network" rule established in WP-07/WP-08/WP-10.
bootstrap.servers=kafka-broker-1:19092,kafka-broker-2:19092,kafka-broker-3:19092

# Distributed mode's own identity: every worker sharing this group.id
# forms ONE logical Connect cluster and divides connectors/tasks among
# themselves. This lab runs a single worker, but the config is
# distributed-mode's real config either way -- production Connect almost
# always runs distributed mode for exactly the HA/scaling this group.id
# coordination provides, even when starting from one worker.
group.id=wp11-connect-cluster

# Distributed mode's three internal, Kafka-backed state topics -- see the
# conceptual doc for what each one actually stores. Replication factor 3
# matches the reused cluster's real 3 brokers (a genuine HA setting here,
# not WP-02's single-node RF=1 necessity).
config.storage.topic=connect-configs
config.storage.replication.factor=3
offset.storage.topic=connect-offsets
offset.storage.replication.factor=3
offset.storage.partitions=25
status.storage.topic=connect-status
status.storage.replication.factor=3
status.storage.partitions=5

offset.flush.interval.ms=10000

# JSON with schemas enabled (not schemas.enable=false, and not Avro) --
# deliberately, so Debezium's own structured envelope (before/after/op/
# source, each with real field-level schema metadata) is directly visible
# in the raw record value without needing a Schema Registry client to
# decode it, which matters for a lab whose point is showing the CDC event
# SHAPE itself. See the conceptual doc for the real tradeoff against
# Avro (WP-10's own registry is not reused here on purpose -- see
# "Environment").
key.converter=org.apache.kafka.connect.json.JsonConverter
key.converter.schemas.enable=true
value.converter=org.apache.kafka.connect.json.JsonConverter
value.converter.schemas.enable=true

# Where this worker looks for connector plugins -- bind-mounted from
# platform/kafka-connect/plugins/ (fetch-debezium-plugin.sh's output).
# The FileStream source/sink connectors used for Phase 1 need NO entry
# here at all -- they ship inside connect-file-4.3.1.jar, already on this
# image's main classpath.
plugin.path=/opt/kafka/connect-plugins

rest.host.name=0.0.0.0
rest.port=8083
