# Confluent Schema Registry for WP-10 (schema evolution & governance).
#
# This is a SEPARATE compose project from platform/kafka-cluster/ (WP-07's
# 3-broker cluster) on purpose -- see platform/schema-registry/README.md,
# "Why a separate compose file, same network," for the full reasoning. In
# short: Schema Registry is an ecosystem component layered AROUND Kafka,
# not part of the Kafka broker protocol (see docs/schema-evolution/
# SCHEMA_EVOLUTION_AND_GOVERNANCE.md, Section 2) -- keeping it in its own
# compose file, attached to the EXISTING kafka-cluster_default network as
# an external network, makes that architectural boundary visible in the
# repository layout itself, rather than editing WP-07's own file to blend
# the two together.
#
# Prerequisite: platform/kafka-cluster/ must already be running
# (`docker compose up -d` there first) -- this file does not start Kafka
# itself, and depends on the `kafka-cluster_default` network Docker Compose
# creates for that project (derived from its directory name).

services:
  schema-registry:
    # Pinned to an explicit version, never `latest` -- matched EXACTLY to
    # this lab's Confluent client library version (7.9.2, see
    # labs/lab-09-schema-evolution-governance/build.gradle) so there is no
    # ambiguity about which side's behavior an observed result comes from.
    image: confluentinc/cp-schema-registry:7.9.2
    container_name: schema-registry
    hostname: schema-registry
    networks:
      - kafka-cluster_default
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      # Talks to the brokers over their INTERNAL (PLAINTEXT, :19092)
      # listener, by Docker network hostname -- the same
      # "internal-listener-for-anything-inside-the-network" rule
      # WP-07/WP-08 already established for CLI tools run via `docker exec`.
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "PLAINTEXT://kafka-broker-1:19092,PLAINTEXT://kafka-broker-2:19092,PLAINTEXT://kafka-broker-3:19092"
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"
      # Schema Registry's own internal state (subjects, versions, configs)
      # lives in a Kafka topic it manages itself, `_schemas` -- real
      # evidence of this topic's existence and configuration is captured in
      # the conceptual doc, Section 8. Replication factor 3 matches the
      # reused cluster's 3 real brokers; this is NOT the single-broker
      # necessity WP-02's environment needed.
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 3
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 20s

networks:
  kafka-cluster_default:
    external: true
