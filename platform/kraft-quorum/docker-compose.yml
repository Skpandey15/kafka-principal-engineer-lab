# Local KRaft environment for WP-08 (controller quorum and controller
# failure) with the control plane and data plane on SEPARATE nodes --
# see platform/kraft-quorum/README.md for the full explanation of why
# this differs from WP-02's and WP-07's combined-role topologies.
#
# This is a SEPARATE environment from platform/kafka/ (WP-02, single
# combined node) and platform/kafka-cluster/ (WP-07, three combined
# broker+controller nodes) -- different container names, different
# network, different volumes, different host ports (9096-9098 for
# brokers; the controllers have no client-facing port at all, matching
# real production practice of never exposing controller listeners to
# clients). All three environments can run at the same time without
# conflict. Broker containers are named kraft-quorum-broker-N
# (deliberately NOT kafka-broker-N) specifically so this environment can
# run alongside platform/kafka-cluster/'s WP-07 containers without a
# Docker container-name collision.
#
# Topology: 3 controller-only voters + 3 broker-only nodes. Every node
# ID is unique across the WHOLE cluster (KRaft shares one ID namespace
# between controllers and brokers) -- controllers are 1/2/3, brokers are
# 4/5/6.

services:
  kafka-controller-1:
    image: apache/kafka:4.3.1
    container_name: kafka-controller-1
    hostname: kafka-controller-1
    environment:
      KAFKA_NODE_ID: 1
      # process.roles=controller ONLY -- this node never holds a
      # partition replica and never serves a produce/fetch request. See
      # the README for why this separation is the point of this WP.
      KAFKA_PROCESS_ROLES: "controller"
      KAFKA_LISTENERS: "CONTROLLER://:29093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      # Identical on every controller AND every broker -- this is the
      # quorum's membership list, not a per-node setting. All 3 voters,
      # addressed by their Docker network hostnames (this traffic never
      # leaves the Docker network, and controllers are never given a
      # host-published port -- see the README's "Why controllers have no
      # host port" note).
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-controller-1:29093,2@kafka-controller-2:29093,3@kafka-controller-3:29093"
      # Generated for real via `kafka-storage.sh random-uuid` against the
      # pinned apache/kafka:4.3.1 image -- shared by every node in this
      # cluster (controllers and brokers alike), because that shared
      # value is what makes them one cluster.
      CLUSTER_ID: "6Zy-q9GlR3u9dQkH6Aj_4A"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    volumes:
      - kafka-controller-1-data:/var/lib/kafka/data

  kafka-controller-2:
    image: apache/kafka:4.3.1
    container_name: kafka-controller-2
    hostname: kafka-controller-2
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: "controller"
      KAFKA_LISTENERS: "CONTROLLER://:29093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-controller-1:29093,2@kafka-controller-2:29093,3@kafka-controller-3:29093"
      CLUSTER_ID: "6Zy-q9GlR3u9dQkH6Aj_4A"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    volumes:
      - kafka-controller-2-data:/var/lib/kafka/data

  kafka-controller-3:
    image: apache/kafka:4.3.1
    container_name: kafka-controller-3
    hostname: kafka-controller-3
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: "controller"
      KAFKA_LISTENERS: "CONTROLLER://:29093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-controller-1:29093,2@kafka-controller-2:29093,3@kafka-controller-3:29093"
      CLUSTER_ID: "6Zy-q9GlR3u9dQkH6Aj_4A"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    volumes:
      - kafka-controller-3-data:/var/lib/kafka/data

  kraft-quorum-broker-1:
    image: apache/kafka:4.3.1
    container_name: kraft-quorum-broker-1
    hostname: kraft-quorum-broker-1
    ports:
      - "9096:9092"
    environment:
      KAFKA_NODE_ID: 4
      # process.roles=broker ONLY -- this node holds no vote in the
      # metadata quorum and cannot become controller leader.
      KAFKA_PROCESS_ROLES: "broker"
      KAFKA_LISTENERS: "PLAINTEXT_HOST://:9092,PLAINTEXT://:19092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://localhost:9096,PLAINTEXT://kraft-quorum-broker-1:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      # A broker still needs to know how to reach the controller quorum
      # (to register itself, fetch metadata, and forward metadata
      # mutations) even though it never listens on the CONTROLLER
      # listener itself.
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-controller-1:29093,2@kafka-controller-2:29093,3@kafka-controller-3:29093"
      CLUSTER_ID: "6Zy-q9GlR3u9dQkH6Aj_4A"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_OFFSETS_TOPIC_MIN_ISR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kraft-quorum-broker-1-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s

  kraft-quorum-broker-2:
    image: apache/kafka:4.3.1
    container_name: kraft-quorum-broker-2
    hostname: kraft-quorum-broker-2
    ports:
      - "9097:9092"
    environment:
      KAFKA_NODE_ID: 5
      KAFKA_PROCESS_ROLES: "broker"
      KAFKA_LISTENERS: "PLAINTEXT_HOST://:9092,PLAINTEXT://:19092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://localhost:9097,PLAINTEXT://kraft-quorum-broker-2:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-controller-1:29093,2@kafka-controller-2:29093,3@kafka-controller-3:29093"
      CLUSTER_ID: "6Zy-q9GlR3u9dQkH6Aj_4A"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_OFFSETS_TOPIC_MIN_ISR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kraft-quorum-broker-2-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s

  kraft-quorum-broker-3:
    image: apache/kafka:4.3.1
    container_name: kraft-quorum-broker-3
    hostname: kraft-quorum-broker-3
    ports:
      - "9098:9092"
    environment:
      KAFKA_NODE_ID: 6
      KAFKA_PROCESS_ROLES: "broker"
      KAFKA_LISTENERS: "PLAINTEXT_HOST://:9092,PLAINTEXT://:19092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://localhost:9098,PLAINTEXT://kraft-quorum-broker-3:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-controller-1:29093,2@kafka-controller-2:29093,3@kafka-controller-3:29093"
      CLUSTER_ID: "6Zy-q9GlR3u9dQkH6Aj_4A"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_OFFSETS_TOPIC_MIN_ISR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kraft-quorum-broker-3-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  kafka-controller-1-data:
    name: kafka-principal-engineer-lab_kraft-quorum-controller-1-data
  kafka-controller-2-data:
    name: kafka-principal-engineer-lab_kraft-quorum-controller-2-data
  kafka-controller-3-data:
    name: kafka-principal-engineer-lab_kraft-quorum-controller-3-data
  kraft-quorum-broker-1-data:
    name: kafka-principal-engineer-lab_kraft-quorum-broker-1-data
  kraft-quorum-broker-2-data:
    name: kafka-principal-engineer-lab_kraft-quorum-broker-2-data
  kraft-quorum-broker-3-data:
    name: kafka-principal-engineer-lab_kraft-quorum-broker-3-data
