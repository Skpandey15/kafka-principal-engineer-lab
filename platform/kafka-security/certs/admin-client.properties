# A real SASL_SSL client config for the "admin" SCRAM user -- used by
# this environment's own healthcheck, and a template for any client
# (including this lab's own Java apps) connecting to the real
# SASL_SSL listener. LOCAL-DEVELOPMENT-ONLY: a real deployment injects
# credentials via a secrets manager, never a checked-in properties
# file -- see the lab README's "Production considerations."
security.protocol=SASL_SSL
sasl.mechanism=SCRAM-SHA-512
sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="admin" password="admin-secret";
ssl.truststore.location=/etc/kafka/secrets/truststore.p12
ssl.truststore.password=lab-security-changeit
ssl.truststore.type=PKCS12
