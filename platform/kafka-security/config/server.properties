# Real broker config for WP-18 (security) -- a single combined
# broker+controller node, deliberately simpler than the WP-07 3-broker
# cluster (see the platform README's "Why single-node here"). Written
# directly rather than assembled from KAFKA_* env vars via the image's
# own docker wrapper, since SASL/TLS/authorizer configuration needs
# fine control the env-var convenience layer doesn't expose cleanly.

process.roles=broker,controller
node.id=1
log.dirs=/var/lib/kafka/data

# Controller traffic stays PLAINTEXT -- a real, deliberate scope choice
# for this single-node lab (there is no separate controller process to
# eavesdrop on; the ONE process is both broker and controller). A real
# multi-node production deployment would secure this listener too --
# see the lab README, "Production considerations."
# TWO client-facing listeners, not one -- the SAME reason
# platform/kafka-cluster/README.md's "Why three different host ports"
# already names, hit for real here too: a client's FIRST connection
# (bootstrap) reaches the broker fine via whatever address you dial,
# but every SUBSEQUENT metadata-directed reconnect (produce, topic
# management, everything past the initial handshake) uses the
# ADVERTISED address -- and that address can't simultaneously be
# correct for a host-side client (needs the published host port,
# 9096) AND an in-container/docker-network client (needs the
# container's own internal address, security-broker:9093) with only
# one listener. Confirmed the hard way: with a single listener
# advertised as localhost:9093, every host-side admin/producer call
# timed out with "Timed out waiting for a node assignment" the moment
# it needed a second, metadata-directed connection.
listeners=CONTROLLER://:29093,INTERNAL://:9093,CLIENT://:9094
advertised.listeners=INTERNAL://security-broker:9093,CLIENT://localhost:9096
listener.security.protocol.map=CONTROLLER:PLAINTEXT,INTERNAL:SASL_SSL,CLIENT:SASL_SSL
controller.listener.names=CONTROLLER
inter.broker.listener.name=INTERNAL
controller.quorum.voters=1@security-broker:29093

# SASL/SCRAM -- the real client-facing authentication mechanism.
# SCRAM-SHA-512, not PLAIN: PLAIN sends credentials in the clear over
# whatever transport carries it (TLS still protects it here, since the
# CLIENT listener is SASL_SSL, but SCRAM's own challenge-response
# design means the broker never receives -- or needs to store -- the
# plaintext password at all, a real, independent layer of protection).
sasl.enabled.mechanisms=SCRAM-SHA-512
sasl.mechanism.inter.broker.protocol=SCRAM-SHA-512
# The broker's OWN identity when it needs to act as a client (e.g. to
# itself, for internal topic management) -- a real SCRAM user this
# same broker's storage is formatted with (see fetch/format step).
sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="admin" password="admin-secret";
# The SERVER side accepting SASL_SSL connections on EACH listener --
# deliberately bare (no embedded username/password): real connecting
# clients supply their OWN credentials, verified against the cluster's
# real stored SCRAM credentials, not a shared secret baked into this
# config file.
listener.name.client.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;
listener.name.internal.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;

# TLS -- real certs generated by certs/generate-certs.sh (a self-signed
# CA, LOCAL-DEVELOPMENT-ONLY -- see that script's own comments and the
# lab README's "Production considerations").
ssl.keystore.location=/etc/kafka/secrets/broker.keystore.p12
ssl.keystore.password=lab-security-changeit
ssl.key.password=lab-security-changeit
ssl.keystore.type=PKCS12
ssl.truststore.location=/etc/kafka/secrets/truststore.p12
ssl.truststore.password=lab-security-changeit
ssl.truststore.type=PKCS12
# One-way TLS (server authentication only) -- the client verifies the
# broker's certificate, but does not present one of its own. Real,
# common production choice when SASL already handles client
# authentication; mutual TLS (ssl.client.auth=required) is named, not
# built, here -- see the lab README.
ssl.client.auth=none

# Real KRaft-native authorization -- confirmed present in this pinned
# image (org/apache/kafka/metadata/authorizer/StandardAuthorizer.class,
# kafka-metadata-4.3.1.jar), the successor to the ZooKeeper-era
# kafka.security.authorizer.AclAuthorizer.
authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
# A real finding building this lab: StandardAuthorizer applies to
# EVERY listener, including the internal, PLAINTEXT-only CONTROLLER
# listener -- the broker's own self-registration with the controller
# (BROKER_REGISTRATION, CONTROLLER_REGISTRATION) runs as User:ANONYMOUS
# on that listener (PLAINTEXT has no authentication at all), and
# without ANONYMOUS also listed here, the broker's own internal
# bootstrap traffic is denied by the very authorizer meant to protect
# CLIENT traffic (confirmed: real ClusterAuthorizationException,
# "needs CLUSTER_ACTION permission", broker never finishes starting).
# Safe specifically because the CONTROLLER listener is NEVER published
# to the host or reachable outside this compose network -- ANONYMOUS
# here means "this single process talking to itself," not an exposed
# attack surface.
super.users=User:admin;User:ANONYMOUS

offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
share.coordinator.state.topic.replication.factor=1
share.coordinator.state.topic.min.isr=1
group.initial.rebalance.delay.ms=0
