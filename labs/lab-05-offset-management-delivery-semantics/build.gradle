// Lab 05 — Offset Management & Delivery Semantics (WP-06).
//
// Same dependency set and versions as lab-02/lab-03/lab-04 -- a separate,
// self-contained Gradle project, per this repository's established
// one-project-per-lab convention (see lab-03's README, "Why a separate
// project").

import java.time.Duration

plugins {
    id 'java'
}

group = 'com.kafkalab'
version = '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.kafka:kafka-clients:4.3.1'

    implementation 'org.slf4j:slf4j-api:2.0.19'
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.19'

    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation 'org.testcontainers:testcontainers:2.0.5'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter:2.0.5'
    testImplementation 'org.testcontainers:testcontainers-kafka:2.0.5'
}

test {
    useJUnitPlatform()
    timeout = Duration.ofMinutes(5)
    testLogging {
        events = ['passed', 'skipped', 'failed']
        exceptionFormat = 'full'
    }
}

// --- Runnable experiments -------------------------------------------------

tasks.register('runProducer', JavaExec) {
    group = 'lab experiments'
    description = 'Seed the lab topic with eventId-tagged order events.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.kafkalab.deliverysemantics.producer.OrderEventProducerApp'
    systemProperty 'bootstrapServers', findProperty('bootstrapServers') ?: 'localhost:9092'
    systemProperty 'topic', findProperty('topic') ?: 'orders.delivery-semantics.lab'
    systemProperty 'count', findProperty('count') ?: '10'
    systemProperty 'startEventNumber', findProperty('startEventNumber') ?: '1'
}

tasks.register('runOffsetLifecycle', JavaExec) {
    group = 'lab experiments'
    description = 'Experiment: record offset vs. consumer position vs. committed offset, restart, auto.offset.reset.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.kafkalab.deliverysemantics.consumer.OffsetLifecycleApp'
    systemProperty 'bootstrapServers', findProperty('bootstrapServers') ?: 'localhost:9092'
    systemProperty 'topic', findProperty('topic') ?: 'orders.delivery-semantics.lab'
    systemProperty 'groupId', findProperty('groupId') ?: 'offset-lifecycle-demo'
    systemProperty 'clientId', findProperty('clientId') ?: 'consumer-1'
    systemProperty 'autoOffsetReset', findProperty('autoOffsetReset') ?: 'earliest'
    systemProperty 'maxRecords', findProperty('maxRecords') ?: '5'
}

tasks.register('runDeliverySemantics', JavaExec) {
    group = 'lab experiments'
    description = 'The crash-injection-capable consumer: at-most-once/at-least-once/idempotent/batch-boundary/rebalance experiments. See the README for the full flag reference.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.kafkalab.deliverysemantics.consumer.DeliverySemanticsApp'
    standardInput = System.in
    systemProperty 'bootstrapServers', findProperty('bootstrapServers') ?: 'localhost:9092'
    systemProperty 'topic', findProperty('topic') ?: 'orders.delivery-semantics.lab'
    systemProperty 'groupId', findProperty('groupId') ?: 'delivery-semantics-demo'
    systemProperty 'clientId', findProperty('clientId') ?: 'consumer-1'
    systemProperty 'commitTiming', findProperty('commitTiming') ?: 'AFTER_PROCESS'
    systemProperty 'commitMode', findProperty('commitMode') ?: 'SYNC'
    systemProperty 'failurePoint', findProperty('failurePoint') ?: 'NONE'
    systemProperty 'crashAtEventId', findProperty('crashAtEventId') ?: ''
    systemProperty 'failAtEventId', findProperty('failAtEventId') ?: ''
    systemProperty 'idempotent', findProperty('idempotent') ?: 'false'
    systemProperty 'processingDelayMs', findProperty('processingDelayMs') ?: '0'
    systemProperty 'maxRecords', findProperty('maxRecords') ?: '0'
    systemProperty 'autoCommit', findProperty('autoCommit') ?: 'false'
}
