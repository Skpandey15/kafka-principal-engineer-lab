// Lab 03 — Kafka Partitioning & Ordering Engineering (WP-04).
//
// Same dependency set and versions as lab-02-native-java-producer-consumer
// (WP-03) -- this lab is a separate, self-contained Gradle project rather
// than a shared multi-module build, matching this repository's existing
// one-project-per-lab convention (lab-01 and lab-02 each own everything
// they need). See this lab's README ("Why a separate project") for why
// that convention was kept rather than introducing a multi-module Gradle
// structure in this work package.

import java.time.Duration

plugins {
    id 'java'
}

group = 'com.kafkalab'
version = '0.1.0'

java {
    // Same Java 21 (LTS) baseline WP-03 established -- see that lab's
    // README for the full rationale. Not repeated here.
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.kafka:kafka-clients:4.3.1'

    implementation 'org.slf4j:slf4j-api:2.0.19'
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.19'

    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation 'org.testcontainers:testcontainers:2.0.5'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter:2.0.5'
    testImplementation 'org.testcontainers:testcontainers-kafka:2.0.5'
}

test {
    useJUnitPlatform()
    timeout = Duration.ofMinutes(5)
    testLogging {
        events = ['passed', 'skipped', 'failed']
        exceptionFormat = 'full'
    }
}

// --- Runnable experiments -------------------------------------------------
// One task per experiment in the lab README, same pattern WP-03 used.
// Configurable values are Gradle project properties (-Pname=value).

tasks.register('runBusinessOrdering', JavaExec) {
    group = 'lab experiments'
    description = 'Experiment: order-lifecycle events keyed by orderId -- partition affinity and within-partition ordering, proven by producing then consuming.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.kafkalab.partitioning.producer.BusinessOrderingApp'
    systemProperty 'bootstrapServers', findProperty('bootstrapServers') ?: 'localhost:9092'
    systemProperty 'topic', findProperty('topic') ?: 'orders-lifecycle'
}

tasks.register('runNullKeyDistribution', JavaExec) {
    group = 'lab experiments'
    description = 'Experiment: null-key distribution at measurable scale -- observed, not assumed.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.kafkalab.partitioning.producer.NullKeyDistributionApp'
    systemProperty 'bootstrapServers', findProperty('bootstrapServers') ?: 'localhost:9092'
    systemProperty 'topic', findProperty('topic') ?: 'distribution-demo'
    systemProperty 'count', findProperty('count') ?: '10000'
}

