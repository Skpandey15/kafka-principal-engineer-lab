tasks.register('runConsumerParallelism', JavaExec) {
    group = 'lab experiments'
    description = 'Experiment: partition count as a ceiling on useful consumer-group parallelism. Run multiple instances with different -PclientId.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.kafkalab.partitioning.consumer.ConsumerParallelismApp'
    standardInput = System.in
    systemProperty 'bootstrapServers', findProperty('bootstrapServers') ?: 'localhost:9092'
    systemProperty 'topic', findProperty('topic') ?: 'distribution-demo'
    systemProperty 'groupId', findProperty('groupId') ?: 'partitioning-lab-group'
    systemProperty 'clientId', findProperty('clientId') ?: 'consumer-a'
}
