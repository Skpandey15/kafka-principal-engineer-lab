// Lab 16 — Performance & Capacity Engineering (WP-17).
//
// Same one-project-per-lab convention every prior lab uses.

import java.time.Duration

plugins {
    id 'java'
}

group = 'com.kafkalab'
version = '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.kafka:kafka-clients:4.3.1'

    implementation 'org.slf4j:slf4j-api:2.0.19'
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.19'

    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation 'org.testcontainers:testcontainers:2.0.5'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter:2.0.5'
}

test {
    useJUnitPlatform()
    timeout = Duration.ofMinutes(12)
    testLogging {
        events = ['passed', 'skipped', 'failed']
        exceptionFormat = 'full'
    }
}

def defaultBootstrap = 'localhost:9093,localhost:9094,localhost:9095'

tasks.register('runBenchmark', JavaExec) {
    group = 'lab experiments'
    description = 'Runs a real producer benchmark against the reused WP-07 cluster. -Pprofile=unbatched|batched|batched-lz4'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.kafkalab.performance.bench.BenchmarkApp'
    systemProperty 'bootstrapServers', findProperty('bootstrapServers') ?: defaultBootstrap
    systemProperty 'topic', findProperty('topic') ?: 'perf-bench'
    systemProperty 'recordCount', findProperty('recordCount') ?: '20000'
    systemProperty 'payloadSize', findProperty('payloadSize') ?: '512'
    systemProperty 'profile', findProperty('profile') ?: 'batched'
}
