# Logging for the lab's runnable experiments (SLF4J Simple backend).
#
# Everything defaults to WARN so a run isn't drowned in noise, with the
# specific Kafka client package groups this lab cares about raised to INFO.
# Every category below was confirmed to exist in kafka-clients:4.3.1 by
# inspecting the actual jar (org/apache/kafka/clients/**) rather than
# copied from an unrelated version's logging guide.
#
# org.apache.kafka.clients          -> Metadata, NetworkClient: cluster
#                                      metadata refreshes and broker
#                                      connection state.
# org.apache.kafka.clients.producer -> KafkaProducer plus its internals
#                                      (RecordAccumulator, Sender):
#                                      batching and the background send path.
# org.apache.kafka.clients.consumer -> KafkaConsumer plus its internals
#                                      (the coordinator, group membership,
#                                      the fetch path): joins, rebalances,
#                                      and fetch activity.
#
# To go deeper temporarily -- e.g., while working through a failure
# experiment -- change any one line below to DEBUG and rerun. Leaving
# everything at DEBUG by default would bury the one or two log lines that
# actually matter for a given experiment.
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.log.org.apache.kafka.clients=info
org.slf4j.simpleLogger.log.org.apache.kafka.clients.producer=info
org.slf4j.simpleLogger.log.org.apache.kafka.clients.consumer=info

org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS
org.slf4j.simpleLogger.showShortLogName=true
