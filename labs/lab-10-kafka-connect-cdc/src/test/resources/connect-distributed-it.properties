# Kafka Connect distributed-mode worker configuration for KafkaConnectCluster
# (the Testcontainers test environment) -- mirrors
# platform/kafka-connect/config/connect-distributed.properties, with
# container aliases matched to KafkaConnectCluster's own fixed network
# aliases (it-kafka) instead of the manual environment's
# (kafka-broker-1/2/3).

bootstrap.servers=it-kafka:19092

group.id=it-connect-cluster

config.storage.topic=connect-configs
config.storage.replication.factor=1
offset.storage.topic=connect-offsets
offset.storage.replication.factor=1
offset.storage.partitions=5
status.storage.topic=connect-status
status.storage.replication.factor=1
status.storage.partitions=1

offset.flush.interval.ms=3000

key.converter=org.apache.kafka.connect.json.JsonConverter
key.converter.schemas.enable=true
value.converter=org.apache.kafka.connect.json.JsonConverter
value.converter.schemas.enable=true

plugin.path=/opt/kafka/connect-plugins

rest.host.name=0.0.0.0
rest.port=8083
