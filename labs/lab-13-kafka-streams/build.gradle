// Lab 13 — Kafka Streams (WP-14).
//
// Same one-project-per-lab convention every prior lab uses.

import java.time.Duration

plugins {
    id 'java'
}

group = 'com.kafkalab'
version = '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.kafka:kafka-clients:4.3.1'
    implementation 'org.apache.kafka:kafka-streams:4.3.1'

    implementation 'org.slf4j:slf4j-api:2.0.19'
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.19'

    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // TopologyTestDriver -- an in-memory Kafka Streams test harness
    // that needs no real broker at all, a different (and much faster)
    // testing style from every prior lab's Testcontainers-only suites.
    testImplementation 'org.apache.kafka:kafka-streams-test-utils:4.3.1'

    testImplementation 'org.testcontainers:testcontainers:2.0.5'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter:2.0.5'
}

test {
    useJUnitPlatform()
    timeout = Duration.ofMinutes(15)
    testLogging {
        events = ['passed', 'skipped', 'failed']
        exceptionFormat = 'full'
    }
}

// --- Runnable experiments -------------------------------------------------

def defaultBootstrap = 'localhost:9093,localhost:9094,localhost:9095'

tasks.register('runStreamsApp', JavaExec) {
    group = 'lab experiments'
    description = 'Runs one of this lab\'s three topologies as a real Kafka Streams application instance.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.kafkalab.streams.app.StreamsApp'
    systemProperty 'bootstrapServers', findProperty('bootstrapServers') ?: defaultBootstrap
    systemProperty 'applicationId', findProperty('applicationId') ?: 'lab-13-streams-app'
    systemProperty 'topology', findProperty('topology') ?: 'aggregation'
    systemProperty 'processingGuarantee', findProperty('processingGuarantee') ?: 'at_least_once'
    systemProperty 'numStandbyReplicas', findProperty('numStandbyReplicas') ?: '0'
}
