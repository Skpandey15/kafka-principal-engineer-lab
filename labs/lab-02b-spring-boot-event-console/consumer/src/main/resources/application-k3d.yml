# Profile: k3d -- the consumer runs as a pod in the k3d cluster (platform-k8s/event-console).
#
# Kafka is addressed by its IN-CLUSTER listener (kafka.kafka.svc.cluster.local:19092), NOT
# localhost:9092: that one is advertised for clients on the host, and a pod connecting to it
# would reach itself. The consumer's MongoDB URI carries ITS OWN generated credentials (a user
# that can only read/write the consumer's database), so it MUST be injected -- the manifest
# takes it from the `consumer-mongo` Secret. There is deliberately no default, so a missing
# secret fails at startup instead of connecting somewhere wrong.
spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:kafka.kafka.svc.cluster.local:19092}
  mongodb:
    uri: ${MONGODB_URI}

app:
  schema:
    registry-url: ${SCHEMA_REGISTRY_URL:http://schema-registry.event-console.svc.cluster.local:8081}
  # The k3d Kafka is a single node: replication factor 1 is the only value it can satisfy.
  topic-partitions: ${APP_TOPIC_PARTITIONS:3}
  topic-replicas: 1
  topic-min-insync-replicas: 1
