# Consumer service -- settings common to every environment. Anything that differs between a
# laptop, a k3d cluster and AWS lives in application-{local,k3d,aws}.yml -- activate one with
#   SPRING_PROFILES_ACTIVE=local|k3d|aws        (or --spring.profiles.active=...)
# With nothing set, `local` is used so `./gradlew bootRun` just works.
spring:
  application:
    name: event-console-consumer
  profiles:
    default: local

  # --- Kafka (connection details come from the profile) ----------------------
  kafka:
    consumer:
      # Offsets are committed by the listener container only after the batch was stored
      # (at-least-once); the Mongo write is idempotent, so a redelivery is harmless.
      group-id: ${APP_CONSUMER_GROUP:event-console-consumer}
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 500
      properties:
        max.poll.interval.ms: 300000
    listener:
      ack-mode: batch
    producer:
      # The consumer only ever PRODUCES to publish dead events to the dead-letter topic.
      # Same durability settings as the producer service.
      acks: all
      properties:
        enable.idempotence: true
        request.timeout.ms: 15000
        delivery.timeout.ms: 30000
        max.block.ms: 15000

  # --- MongoDB (the URI comes from the profile): the consumer's OWN database -------
  data:
    mongodb:
      auto-index-creation: true

server:
  port: 8080
  # Finish in-flight requests and let the Kafka consumer commit before the pod dies.
  shutdown: graceful
  # Don't leak framework details in error bodies.
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

# --- App ---------------------------------------------------------------------
app:
  topic: ${APP_TOPIC:event-console}
  # One consumer thread per partition: the most parallelism a consumer group can use.
  consumer-concurrency: ${app.topic-partitions}
  # When MongoDB itself is unreachable the consumer waits and retries forever with this backoff
  # (an outage is not the event's fault, so nothing is skipped or dead-lettered).
  consumer-backoff-initial-ms: 500
  consumer-backoff-max-ms: 5000
  # SUCCESS events are a read model (Kafka is the system of record), so they expire.
  # FAILED and DEAD events never expire on their own.
  events-ttl: ${APP_EVENTS_TTL:7d}

  # The event contract. Events must carry an x-schema-id header naming a JSON Schema in this
  # registry; an event that does not follow its schema is FAILED and goes through the retry path.
  # The URL (app.schema.registry-url) comes from the profile. If the registry is unreachable the consumer waits
  # (like a MongoDB outage) instead of failing events; schemas already seen keep working.
  schema:
    connect-timeout-ms: 2000
    read-timeout-ms: 5000

  # Events that fail processing are stored as FAILED and retried by the worker in this service.
  retry:
    enabled: ${APP_RETRY_ENABLED:true}
    # Retries AFTER the first failed attempt. When the last one fails the event becomes DEAD.
    max-retries: ${APP_RETRY_MAX:5}
    # Wait before the first retry; doubles each time (5s, 10s, 20s, 40s, 80s) up to the cap.
    backoff-initial-ms: ${APP_RETRY_BACKOFF_INITIAL_MS:5000}
    backoff-max-ms: ${APP_RETRY_BACKOFF_MAX_MS:300000}
    poll-interval-ms: 2000
    # At most this many events per poll, so a large backlog cannot starve the dead-letter sweep.
    batch-size: 50
    # A claimed event is invisible to other workers this long; must exceed one processing attempt.
    lease-ms: 60000
    dlt-send-timeout-ms: 15000

# --- Observability -----------------------------------------------------------
management:
  # Every series carries which service it came from, so a Prometheus scraping both can tell them apart.
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    org.apache.kafka: WARN
    org.mongodb.driver: WARN
