spring.application.name=event-console
server.port=8080
# Finish in-flight requests and let the Kafka consumer commit before the pod dies.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s
# Don't leak framework details in error bodies.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false

# --- Kafka ---------------------------------------------------------------
# Host default is the k3d/Compose host port; inside Kubernetes the app is given
# the in-cluster listener (kafka.kafka.svc.cluster.local:19092) via KAFKA_BOOTSTRAP.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
# Producer: durability over latency. Idempotence is on by default in the Kafka 4
# client, which also requires acks=all and retries -- stated here so it is explicit.
spring.kafka.producer.acks=all
spring.kafka.producer.compression-type=lz4
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.linger.ms=10
spring.kafka.producer.properties.max.block.ms=15000
# Kafka refuses to even construct a producer unless
# delivery.timeout.ms >= linger.ms + request.timeout.ms.
spring.kafka.producer.properties.request.timeout.ms=15000
spring.kafka.producer.properties.delivery.timeout.ms=30000
# Consumer: offsets are committed by the listener container only after the batch
# was stored (at-least-once); the Mongo write is idempotent so a redelivery is harmless.
spring.kafka.consumer.group-id=${APP_CONSUMER_GROUP:event-console-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.max-poll-records=500
spring.kafka.consumer.properties.max.poll.interval.ms=300000
spring.kafka.listener.ack-mode=batch

# --- MongoDB -------------------------------------------------------------
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/eventconsole}
spring.data.mongodb.auto-index-creation=true

# --- App -----------------------------------------------------------------
app.topic=${APP_TOPIC:event-console}
app.topic-partitions=${APP_TOPIC_PARTITIONS:3}
app.topic-replicas=${APP_TOPIC_REPLICAS:1}
app.consumer-concurrency=${APP_TOPIC_PARTITIONS:3}
app.max-bulk-events=50000
app.consumer-max-retries=5
app.consumer-backoff-initial-ms=500
app.consumer-backoff-max-ms=5000
# The MongoDB copy is a read model; Kafka is the system of record. Expire it.
app.events-ttl=${APP_EVENTS_TTL:7d}

# --- Observability ---------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
logging.level.org.apache.kafka=WARN
logging.level.org.mongodb.driver=WARN
