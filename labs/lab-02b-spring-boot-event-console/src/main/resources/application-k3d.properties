# Profile: k3d -- the app runs as a pod in the k3d cluster (platform-k8s/event-console).
#
# Kafka is addressed by its IN-CLUSTER listener (kafka.kafka.svc.cluster.local:19092), NOT
# localhost:9092: that one is advertised for clients on the host, and a pod connecting to it
# would reach itself. MongoDB's URI carries a generated password, so it MUST be injected
# (the manifest takes it from the event-console-mongo Secret) -- there is deliberately no
# default, so a missing secret fails at startup instead of connecting somewhere wrong.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:kafka.kafka.svc.cluster.local:19092}
spring.mongodb.uri=${MONGODB_URI}

# The k3d Kafka is a single node: replication factor 1 is the only value it can satisfy.
app.topic-partitions=${APP_TOPIC_PARTITIONS:3}
app.topic-replicas=1
app.topic-min-insync-replicas=1
