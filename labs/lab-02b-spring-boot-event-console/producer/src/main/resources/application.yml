# Producer service -- settings common to every environment. Anything that differs between a
# laptop, a k3d cluster and AWS lives in application-{local,k3d,aws}.yml -- activate one with
#   SPRING_PROFILES_ACTIVE=local|k3d|aws        (or --spring.profiles.active=...)
# With nothing set, `local` is used so `./gradlew bootRun` just works.
spring:
  application:
    name: event-console-producer
  profiles:
    default: local

  # --- Kafka (connection details come from the profile) ----------------------
  kafka:
    producer:
      # Durability over latency. Idempotence is on by default in the Kafka 4 client, which
      # also requires acks=all and retries -- stated here so it is explicit.
      acks: all
      compression-type: lz4
      properties:
        enable.idempotence: true
        linger.ms: 10
        max.block.ms: 15000
        # Kafka refuses to even construct a producer unless
        # delivery.timeout.ms >= linger.ms + request.timeout.ms.
        request.timeout.ms: 15000
        delivery.timeout.ms: 30000

  # --- MongoDB (the URI comes from the profile): the producer's OWN database -------
  data:
    mongodb:
      auto-index-creation: true

server:
  port: 8080
  # Finish in-flight requests before the pod dies.
  shutdown: graceful
  # Don't leak framework details in error bodies.
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

# --- App ---------------------------------------------------------------------
app:
  topic: ${APP_TOPIC:event-console}
  max-bulk-events: 50000

  # Every publish is recorded in the audit store BEFORE anything is sent (so the record exists even if
  # this process dies mid-publish). required=true: if that write fails, nothing is sent (HTTP 503).
  # required=false trades the guarantee for availability. A job still STARTED after interrupted-after
  # is labelled INTERRUPTED: its process died and the outcome is unknown.
  audit:
    required: ${APP_AUDIT_REQUIRED:true}
    interrupted-after: ${APP_AUDIT_INTERRUPTED_AFTER:10m}

  # The event contract. Every event is checked against the LATEST version of this subject before
  # anything is sent, and carries the id of the version it was checked against in an x-schema-id
  # header. Nothing is published if any event in a request violates it. The registry URL
  # (app.schema.registry-url) comes from the profile.
  schema:
    subject: ${APP_SCHEMA_SUBJECT:event-console-value}
    connect-timeout-ms: 2000
    read-timeout-ms: 5000
    cache-ttl-ms: 60000
  # Publish-job audit records expire; the events themselves live in Kafka.
  jobs-ttl: ${APP_JOBS_TTL:30d}

# --- Observability -----------------------------------------------------------
management:
  # Every series carries which service it came from, so a Prometheus scraping both can tell them apart.
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    org.apache.kafka: WARN
    org.mongodb.driver: WARN
