spring.application.name=lab-14-spring-kafka

# Defaults point at the reused WP-07 cluster; every test overrides this
# via spring.embedded.kafka.brokers (see @EmbeddedKafka).
spring.kafka.bootstrap-servers=localhost:9093,localhost:9094,localhost:9095
spring.kafka.consumer.group-id=lab-14-spring-kafka
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Deliberately NOT setting spring.kafka.producer.transaction-id-prefix
# here -- a real finding building this lab: that property makes the
# DEFAULT autoconfigured KafkaTemplate (the one every other listener
# and this app's plain test sends use) transactional TOO, and a
# transactional KafkaTemplate refuses any send() outside an active
# transaction scope ("No transaction is in process"). See
# TransactionalProducerConfig for a SEPARATE, dedicated transactional
# template instead -- the more realistic production shape, since most
# of an app's Kafka traffic usually doesn't need transactional
# semantics at all.
