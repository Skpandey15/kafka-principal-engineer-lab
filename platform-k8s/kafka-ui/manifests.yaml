# Kubernetes equivalent of platform/kafka-ui/docker-compose.yml -- Kafbat UI
# (kafbat/kafka-ui), a visual browser for the kafka-cluster environment.
# Prerequisite: platform-k8s/kafka-cluster must already be applied. See
# platform/kafka-ui/README.md for why this fork, not the abandoned
# provectus/kafka-ui image.
apiVersion: v1
kind: Namespace
metadata:
  name: kafka-ui
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: kafka-ui
  labels: { app: kafka-ui }
spec:
  replicas: 1
  selector: { matchLabels: { app: kafka-ui } }
  template:
    metadata: { labels: { app: kafka-ui } }
    spec:
      enableServiceLinks: false
      hostname: kafka-ui
      containers:
        - name: kafka-ui
          image: ghcr.io/kafbat/kafka-ui:v1.5.0
          ports: [{ containerPort: 8080 }]
          env:
            # Cross-namespace FQDN -- kafka-ui lives in its own namespace,
            # same pattern platform-k8s/schema-registry and
            # platform-k8s/kafka-connect already use to reach kafka-cluster's
            # brokers.
            - { name: KAFKA_CLUSTERS_0_NAME, value: "wp07-3-broker-cluster" }
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: "kafka-broker-1.kafka-cluster.svc.cluster.local:19092,kafka-broker-2.kafka-cluster.svc.cluster.local:19092,kafka-broker-3.kafka-cluster.svc.cluster.local:19092"
            # Optional -- only resolves if platform-k8s/schema-registry is
            # also applied. Degrades gracefully if not (schema browsing
            # just won't work), same as the Docker Compose version.
            - { name: KAFKA_CLUSTERS_0_SCHEMAREGISTRY, value: "http://schema-registry.schema-registry.svc.cluster.local:8081" }
            - { name: DYNAMIC_CONFIG_ENABLED, value: "true" }
          readinessProbe:
            # Real endpoint, confirmed against the actual image: `wget` is
            # present (via BusyBox in the Alpine base image, even though
            # the kafbat Dockerfile itself never explicitly installs it --
            # confirmed the hard way by pulling the real image and checking
            # before trusting this).
            exec: { command: ["wget", "-qO-", "http://localhost:8080/actuator/health"] }
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: kafka-ui
spec:
  type: NodePort
  selector: { app: kafka-ui }
  ports: [{ port: 8080, targetPort: 8080, nodePort: 30080 }]
