# Kubernetes deployment of labs/lab-02b-spring-boot-event-console:
# React UI (nginx) -> Spring Boot API -> MongoDB, with Kafka from platform-k8s/kafka.
# Prerequisite: platform-k8s/kafka/setup.sh. Use setup.sh, not `kubectl apply` directly --
# it builds/imports the images and creates the `event-console-mongo` Secret first.
#
# The Secret is deliberately NOT in this file: a password committed to git is not a secret.
# setup.sh generates a random one on first run and never prints it.
apiVersion: v1
kind: Namespace
metadata:
  name: event-console
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
# ---------------------------------------------------------------- MongoDB
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-data
  namespace: event-console
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: event-console
  labels: { app: mongo }
spec:
  replicas: 1
  # One volume, one writer: never run old and new pods side by side.
  strategy: { type: Recreate }
  selector: { matchLabels: { app: mongo } }
  template:
    metadata: { labels: { app: mongo } }
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mongo
          image: mongo:7.0
          # Authentication is on: the image enables --auth when a root user is created.
          args: ["--wiredTigerCacheSizeGB", "0.25"]
          env:
            - { name: MONGO_INITDB_ROOT_USERNAME, value: root }
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: event-console-mongo, key: MONGO_PASSWORD } }
          ports: [{ containerPort: 27017 }]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /data/db }
          readinessProbe:
            exec: { command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"] }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec: { command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"] }
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: mongo-data }
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: event-console
spec:
  selector: { app: mongo }
  ports: [{ port: 27017, targetPort: 27017 }]
---
# ---------------------------------------------------------------- Spring Boot API
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-console-backend
  namespace: event-console
  labels: { app: event-console-backend }
spec:
  replicas: 1
  selector: { matchLabels: { app: event-console-backend } }
  template:
    metadata: { labels: { app: event-console-backend } }
    spec:
      enableServiceLinks: false
      # Longer than the app's 25s graceful-shutdown phase, so Kubernetes does not SIGKILL
      # a pod that is still committing its last consumer offsets.
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # The app builds its MongoDB indexes at startup and gives up after 30s. A fresh
        # MongoDB spends longer than that initializing, which used to crash-loop the API
        # on first deploy. Wait for the port instead of relying on restarts.
        - name: wait-for-mongo
          image: busybox:1.37
          command: ["sh", "-c", "until nc -z -w 2 mongo 27017; do echo waiting for mongo; sleep 2; done"]
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { memory: 32Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      containers:
        - name: backend
          image: kafkalab/event-console-backend:0.1.0
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          env:
            # The `k3d` profile (application-k3d.properties) supplies the in-cluster Kafka listener
            # (kafka.kafka.svc.cluster.local:19092 -- NOT localhost:9092, the host-facing one) and
            # the single-node topic settings. Only what varies per deployment is set here.
            - { name: SPRING_PROFILES_ACTIVE, value: "k3d" }
            - { name: APP_TOPIC, value: "event-console" }
            - { name: APP_CONSUMER_GROUP, value: "event-console-group" }
            - name: MONGODB_URI
              valueFrom: { secretKeyRef: { name: event-console-mongo, key: MONGODB_URI } }
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          # Spring Boot's own probe groups: readiness also reflects that the app is
          # shutting down, so traffic stops before the process does.
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: event-console-backend
  namespace: event-console
spec:
  selector: { app: event-console-backend }
  ports: [{ port: 8080, targetPort: http }]
---
# ---------------------------------------------------------------- React UI (nginx)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-console-frontend
  namespace: event-console
  labels: { app: event-console-frontend }
spec:
  replicas: 1
  selector: { matchLabels: { app: event-console-frontend } }
  template:
    metadata: { labels: { app: event-console-frontend } }
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        # Makes the emptyDir mounted at /etc/nginx/conf.d writable by the nginx user.
        fsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: frontend
          image: kafkalab/event-console-frontend:0.1.0
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          env:
            # Fully-qualified: nginx's resolver does not apply the pod's DNS search domains.
            - { name: BACKEND_UPSTREAM, value: "http://event-console-backend.event-console.svc.cluster.local:8080" }
            - { name: DNS_RESOLVER, value: "kube-dns.kube-system.svc.cluster.local" }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 96Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            # nginx renders its config from the template here at start-up.
            - { name: nginx-conf, mountPath: /etc/nginx/conf.d }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 32Mi } }
        - { name: nginx-conf, emptyDir: { sizeLimit: 1Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: event-console-frontend
  namespace: event-console
spec:
  type: NodePort
  selector: { app: event-console-frontend }
  # Host port 8089 -> NodePort 30089; see platform-k8s/bootstrap-cluster.sh.
  ports: [{ port: 8080, targetPort: http, nodePort: 30089 }]
---
# ---------------------------------------------------------------- Network policies
# Least privilege: MongoDB is reachable only from the API, and the API only from the UI.
# (Ingress rules only -- egress to Kafka in the `kafka` namespace is left open.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongo-from-backend-only
  namespace: event-console
spec:
  podSelector: { matchLabels: { app: mongo } }
  policyTypes: ["Ingress"]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: event-console-backend } } }]
      ports: [{ port: 27017 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-from-frontend-only
  namespace: event-console
spec:
  podSelector: { matchLabels: { app: event-console-backend } }
  policyTypes: ["Ingress"]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: event-console-frontend } } }]
      ports: [{ port: 8080 }]
