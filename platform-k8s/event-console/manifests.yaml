# Kubernetes deployment of labs/lab-02b-spring-boot-event-console:
#
#   browser -> nginx (React UI) --/api/events--> CONSUMER service --> MongoDB (eventconsole_consumer)
#                               \--/api/*------> PRODUCER service --> MongoDB (eventconsole_producer)
#                                                       \--------> Kafka <--------/
#
# The producer and the consumer are separate Deployments that share nothing but the Kafka topic:
# they are built, scaled, restarted and fail independently, and each has its OWN MongoDB database
# and its OWN MongoDB user that can touch only that database.
#
# Prerequisite: platform-k8s/kafka/setup.sh. Use setup.sh, not `kubectl apply` directly -- it
# builds/imports the images and creates the Secrets (event-console-mongo, producer-mongo,
# consumer-mongo, event-console-auth) first.
#
# MongoDB itself is in mongo-single.yaml (the default) or mongo-ha.yaml (a 3-member replica set,
# MONGO_HA=1 ./setup.sh); setup.sh applies exactly one of them next to this file.
#
# The Secrets are deliberately NOT in this file: a password committed to git is not a secret.
# setup.sh generates random ones on first run and never prints them.
apiVersion: v1
kind: Namespace
metadata:
  name: event-console
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
# ---------------------------------------------------------------- Schema Registry (the event contract)
# Holds the versions of the event schema and enforces their compatibility rule when a new version
# is registered (platform-k8s/event-console/contracts/register.sh, never by the services). The
# services only READ it. Its own state lives in the `_schemas` topic on the Kafka broker, so this
# pod keeps no data and can be replaced freely.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-registry
  namespace: event-console
  labels: { app: schema-registry }
spec:
  replicas: 1
  # Registry instances identify each other by host:port; during a default RollingUpdate an old and
  # a new pod briefly coexist and the leader election can reject the second one. Recreate avoids it.
  strategy: { type: Recreate }
  selector: { matchLabels: { app: schema-registry } }
  template:
    metadata: { labels: { app: schema-registry } }
    spec:
      # Kubernetes injects SCHEMA_REGISTRY_PORT for a Service named "schema-registry", and this
      # image's entrypoint hard-exits when that variable exists (documented in
      # platform-k8s/schema-registry/manifests.yaml). Service links off.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        # The image's user is named (appuser), which Kubernetes cannot prove is not root; give it its numeric id.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: schema-registry
          image: confluentinc/cp-schema-registry:7.9.2
          ports: [{ name: http, containerPort: 8081 }]
          env:
            - name: SCHEMA_REGISTRY_HOST_NAME
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - { name: SCHEMA_REGISTRY_LISTENERS, value: "http://0.0.0.0:8081" }
            # The single-node Kafka's in-cluster listener; replication 1 is all it can satisfy.
            - { name: SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS, value: "PLAINTEXT://kafka.kafka.svc.cluster.local:19092" }
            - { name: SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR, value: "1" }
            # The JVM would otherwise size itself from the node, not from this pod's limit.
            - { name: SCHEMA_REGISTRY_HEAP_OPTS, value: "-Xms128m -Xmx256m" }
          resources:
            requests: { cpu: 100m, memory: 320Mi }
            limits: { memory: 512Mi }
          # The image writes its generated config under /etc, so the root filesystem stays writable.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          startupProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /subjects, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: schema-registry
  namespace: event-console
spec:
  selector: { app: schema-registry }
  ports: [{ name: http, port: 8081, targetPort: http }]
---
# ---------------------------------------------------------------- PRODUCER service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-console-producer
  namespace: event-console
  labels: { app: event-console-producer }
spec:
  # Stateless, so it scales horizontally. Two replicas means a pod can die, or be rolled, without
  # publishing stopping. (SINGLE_REPLICA=1 ./setup.sh scales to one on a very small cluster.)
  replicas: 2
  # Never take a pod away before its replacement is Ready.
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: event-console-producer } }
  template:
    metadata: { labels: { app: event-console-producer } }
    spec:
      enableServiceLinks: false
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: { matchLabels: { app: event-console-producer } } }
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # Wait until MongoDB accepts THIS service's credentials (not merely until the port is
        # open): that proves MongoDB is up AND the mongo-users Job has created the user. Avoids
        # a crash-loop on first deploy, when the app's startup index creation would time out.
        - name: wait-for-mongo
          image: mongo:7.0
          command: ["sh", "-c", 'until mongosh "$MONGODB_URI" --quiet --eval "db.runCommand({ping:1}).ok" 2>/dev/null | grep -q 1; do echo waiting for mongo credentials; sleep 3; done']
          env:
            - { name: HOME, value: /tmp }
            - name: MONGODB_URI
              valueFrom: { secretKeyRef: { name: producer-mongo, key: MONGODB_URI } }
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      containers:
        - name: producer
          image: kafkalab/event-console-producer:0.5.0
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          env:
            # The `k3d` profile (application-k3d.yml) supplies the in-cluster Kafka listener
            # (kafka.kafka.svc.cluster.local:19092 -- NOT localhost:9092, the host-facing one) and
            # the single-node topic settings. Only what varies per deployment is set here.
            - { name: SPRING_PROFILES_ACTIVE, value: "k3d" }
            - { name: APP_TOPIC, value: "event-console" }
            - name: MONGODB_URI
              valueFrom: { secretKeyRef: { name: producer-mongo, key: MONGODB_URI } }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 448Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: event-console-producer
  namespace: event-console
spec:
  selector: { app: event-console-producer }
  ports: [{ port: 8080, targetPort: http }]
---
# ---------------------------------------------------------------- CONSUMER service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-console-consumer
  namespace: event-console
  labels: { app: event-console-consumer }
spec:
  # Consumer-group members share the topic's partitions, so replicas beyond the partition count
  # (3) would sit idle. Two gives failover: when one dies the other takes over its partitions
  # (a rebalance, so a short pause), and both run a retry worker. Up to 3 for throughput; never past it.
  replicas: 2
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: event-console-consumer } }
  template:
    metadata: { labels: { app: event-console-consumer } }
    spec:
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: { matchLabels: { app: event-console-consumer } } }
      enableServiceLinks: false
      # Longer than the app's 25s graceful-shutdown phase, so Kubernetes does not SIGKILL a pod
      # that is still committing its last consumer offsets.
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: wait-for-mongo
          image: mongo:7.0
          command: ["sh", "-c", 'until mongosh "$MONGODB_URI" --quiet --eval "db.runCommand({ping:1}).ok" 2>/dev/null | grep -q 1; do echo waiting for mongo credentials; sleep 3; done']
          env:
            - { name: HOME, value: /tmp }
            - name: MONGODB_URI
              valueFrom: { secretKeyRef: { name: consumer-mongo, key: MONGODB_URI } }
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      containers:
        - name: consumer
          image: kafkalab/event-console-consumer:0.5.0
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: "k3d" }
            - { name: APP_TOPIC, value: "event-console" }
            - { name: APP_CONSUMER_GROUP, value: "event-console-consumer" }
            # Where the topic's legacy history ends (contracts/set-cutover.sh writes the ConfigMap). Optional: with
            # no ConfigMap nothing is legacy and the contract covers the whole topic.
            - { name: SPRING_CONFIG_ADDITIONAL_LOCATION, value: "optional:file:/config/cutover/cutover.yml" }
            - name: MONGODB_URI
              valueFrom: { secretKeyRef: { name: consumer-mongo, key: MONGODB_URI } }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 448Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: cutover, mountPath: /config/cutover, readOnly: true }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
        # Optional: absent until contracts/set-cutover.sh creates it.
        - { name: cutover, configMap: { name: event-console-cutover, optional: true } }
---
apiVersion: v1
kind: Service
metadata:
  name: event-console-consumer
  namespace: event-console
spec:
  selector: { app: event-console-consumer }
  ports: [{ port: 8080, targetPort: http }]
---
# ---------------------------------------------------------------- React UI (nginx)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-console-frontend
  namespace: event-console
  labels: { app: event-console-frontend }
spec:
  replicas: 2
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: event-console-frontend } }
  template:
    metadata: { labels: { app: event-console-frontend } }
    spec:
      enableServiceLinks: false
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: { matchLabels: { app: event-console-frontend } } }
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        # Makes the emptyDir mounted at /etc/nginx/conf.d writable by the nginx user.
        fsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: frontend
          image: kafkalab/event-console-frontend:0.5.0
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          env:
            # Fully-qualified: nginx's resolver does not apply the pod's DNS search domains.
            - { name: PRODUCER_UPSTREAM, value: "http://event-console-producer.event-console.svc.cluster.local:8080" }
            - { name: CONSUMER_UPSTREAM, value: "http://event-console-consumer.event-console.svc.cluster.local:8080" }
            - { name: DNS_RESOLVER, value: "kube-dns.kube-system.svc.cluster.local" }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 96Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            # nginx renders its config from the template here at start-up.
            - { name: nginx-conf, mountPath: /etc/nginx/conf.d }
            # htpasswd files for the viewer and operator accounts (generated by setup.sh, never in git).
            - { name: auth, mountPath: /etc/nginx/auth, readOnly: true }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 32Mi } }
        - { name: nginx-conf, emptyDir: { sizeLimit: 1Mi } }
        - name: auth
          secret:
            secretName: event-console-auth
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: event-console-frontend
  namespace: event-console
spec:
  type: NodePort
  selector: { app: event-console-frontend }
  # Host port 8089 -> NodePort 30089; see platform-k8s/bootstrap-cluster.sh.
  ports: [{ port: 8080, targetPort: http, nodePort: 30089 }]
---
# ---------------------------------------------------------------- Network policies
# Least privilege between tiers. (Ingress rules only -- egress to Kafka in the `kafka` namespace
# is left open.) MongoDB is reachable only from the two services and the user-bootstrap Job; each
# service is reachable only from the UI's nginx. The producer and consumer cannot reach each other.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongo-from-services-only
  namespace: event-console
spec:
  podSelector: { matchLabels: { app: mongo } }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: event-console-producer } }
        - podSelector: { matchLabels: { app: event-console-consumer } }
        - podSelector: { matchLabels: { app: mongo-users } }
        # Replica-set mode (mongo-ha.yaml): the members talk to each other, and one Job forms the set.
        - podSelector: { matchLabels: { app: mongo } }
        - podSelector: { matchLabels: { app: mongo-rs-init } }
      ports: [{ port: 27017 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: producer-from-frontend-only
  namespace: event-console
spec:
  podSelector: { matchLabels: { app: event-console-producer } }
  policyTypes: ["Ingress"]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: event-console-frontend } } }]
      ports: [{ port: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: consumer-from-frontend-only
  namespace: event-console
spec:
  podSelector: { matchLabels: { app: event-console-consumer } }
  policyTypes: ["Ingress"]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: event-console-frontend } } }]
      ports: [{ port: 8080 }]
---
# The registry is reachable only by the two services, which only read it. Registering a version
# is done with `kubectl exec` into the registry pod itself (contracts/register.sh), so no other
# pod needs a way in.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: schema-registry-from-services-only
  namespace: event-console
spec:
  podSelector: { matchLabels: { app: schema-registry } }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: event-console-producer } }
        - podSelector: { matchLabels: { app: event-console-consumer } }
      ports: [{ port: 8081 }]
---
# ---------------------------------------------------------------- Disruption budgets
# A voluntary disruption (a node drain, a cluster upgrade) may take at most one pod of a service at a
# time, so a service with two replicas never goes to zero because somebody was patching nodes.
# With SINGLE_REPLICA=1 these budgets would block every drain; remove them on such a cluster.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: event-console-producer
  namespace: event-console
spec:
  minAvailable: 1
  selector: { matchLabels: { app: event-console-producer } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: event-console-consumer
  namespace: event-console
spec:
  minAvailable: 1
  selector: { matchLabels: { app: event-console-consumer } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: event-console-frontend
  namespace: event-console
spec:
  minAvailable: 1
  selector: { matchLabels: { app: event-console-frontend } }
