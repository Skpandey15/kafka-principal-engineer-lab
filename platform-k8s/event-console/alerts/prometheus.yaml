# A small Prometheus for the Event Console (opt-in: alerts/enable.sh). It scrapes every producer and
# consumer pod's /actuator/prometheus and evaluates event-console.rules.yml, so the alerts can be
# watched firing for real. It does not send notifications -- routing alerts to people (Alertmanager,
# PagerDuty, Slack) is deployment-specific and out of scope here.
#
# Scraping is per POD, so each replica has its own `up`: losing one of two pods does not trip
# "the service is down" (the alert rules ask for the service, not a pod).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: event-console
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-pod-discovery
  namespace: event-console
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-pod-discovery
  namespace: event-console
subjects:
  - { kind: ServiceAccount, name: prometheus, namespace: event-console }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: prometheus-pod-discovery }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: event-console
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/rules/event-console.rules.yml
    scrape_configs:
      - job_name: event-console
        metrics_path: /actuator/prometheus
        kubernetes_sd_configs:
          - role: pod
            namespaces: { names: [event-console] }
        relabel_configs:
          # Only the two services, on their HTTP port; the job name is the service name.
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: (event-console-producer|event-console-consumer)
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: http
            action: keep
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: job
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: event-console
  labels: { app: prometheus }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata: { labels: { app: prometheus } }
    spec:
      serviceAccountName: prometheus
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2d
            - --web.enable-lifecycle
          ports: [{ name: http, containerPort: 9090 }]
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus/prometheus.yml, subPath: prometheus.yml }
            - { name: rules, mountPath: /etc/prometheus/rules }
            - { name: data, mountPath: /prometheus }
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            periodSeconds: 10
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: rules
          configMap: { name: event-console-alert-rules }
        - { name: data, emptyDir: { sizeLimit: 512Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: event-console
spec:
  selector: { app: prometheus }
  ports: [{ name: http, port: 9090, targetPort: http }]
---
# The services accept traffic only from the UI's nginx (manifests.yaml); let Prometheus scrape them too.
# Policies add up, so this widens nothing for anybody else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: services-from-prometheus
  namespace: event-console
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [event-console-producer, event-console-consumer] }
  policyTypes: ["Ingress"]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: prometheus } } }]
      ports: [{ port: 8080 }]
