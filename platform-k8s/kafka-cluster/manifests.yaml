# Kubernetes equivalent of platform/kafka-cluster/docker-compose.yml -- a
# real 3-node KRaft cluster (combined broker+controller roles), each running
# the real Prometheus JMX exporter Java agent, exactly like the Compose
# version. Used by lab-06, lab-08 through lab-16, and lab-18's
# production-simulation experiment. See platform/kafka-cluster/README.md for
# the full reasoning behind every KAFKA_* value -- unchanged here.
apiVersion: v1
kind: Namespace
metadata:
  name: kafka-cluster
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jmx-exporter-rules
  namespace: kafka-cluster
data:
  kafka-broker.yml: |
    lowercaseOutputName: true

    rules:
    # Special cases and very specific rules
    - pattern : kafka.server<type=(.+), name=(.+), clientId=(.+), topic=(.+), partition=(.*)><>Value
      name: kafka_server_$1_$2
      type: GAUGE
      labels:
        clientId: "$3"
        topic: "$4"
        partition: "$5"
    - pattern : kafka.server<type=(.+), name=(.+), clientId=(.+), brokerHost=(.+), brokerPort=(.+)><>Value
      name: kafka_server_$1_$2
      type: GAUGE
      labels:
        clientId: "$3"
        broker: "$4:$5"
    - pattern : kafka.coordinator.(\w+)<type=(.+), name=(.+)><>Value
      name: kafka_coordinator_$1_$2_$3
      type: GAUGE
    - pattern: "kafka.server<type=raft-metrics><>current-state: ([a-z]+)"
      name: kafka_server_raft_metrics_current_state_info
      type: GAUGE
      value: 1
      labels:
        "state": "$1"
    - pattern: kafka.server<type=(.+)><>([a-z-]+)-total
      name: kafka_server_$1_$2_total
      type: COUNTER
    - pattern: kafka.server<type=(.+)><>([a-z-]+)
      name: kafka_server_$1_$2
      type: GAUGE
    - pattern: kafka.(\w+)<type=(.+), name=(.+)PerSec\w*, (.+)=(.+), (.+)=(.+)><>Count
      name: kafka_$1_$2_$3_total
      type: COUNTER
      labels:
        "$4": "$5"
        "$6": "$7"
    - pattern: kafka.(\w+)<type=(.+), name=(.+)PerSec\w*, (.+)=(.+)><>Count
      name: kafka_$1_$2_$3_total
      type: COUNTER
      labels:
        "$4": "$5"
    - pattern: kafka.(\w+)<type=(.+), name=(.+)PerSec\w*><>Count
      name: kafka_$1_$2_$3_total
      type: COUNTER
    - pattern: kafka.server<type=(.+), user=(.+), client-id=(.+)><>([a-z-]+)
      name: kafka_server_quota_$4
      type: GAUGE
      labels:
        resource: "$1"
        user: "$2"
        clientId: "$3"
    - pattern: kafka.server<type=(.+), client-id=(.+)><>([a-z-]+)
      name: kafka_server_quota_$3
      type: GAUGE
      labels:
        resource: "$1"
        clientId: "$2"
    - pattern: kafka.server<type=(.+), user=(.+)><>([a-z-]+)
      name: kafka_server_quota_$3
      type: GAUGE
      labels:
        resource: "$1"
        user: "$2"
    - pattern: kafka.(\w+)<type=(.+), name=(.+), (.+)=(.+), (.+)=(.+)><>Value
      name: kafka_$1_$2_$3
      type: GAUGE
      labels:
        "$4": "$5"
        "$6": "$7"
    - pattern: kafka.(\w+)<type=(.+), name=(.+), (.+)=(.+)><>Value
      name: kafka_$1_$2_$3
      type: GAUGE
      labels:
        "$4": "$5"
    - pattern: kafka.(\w+)<type=(.+), name=(.+)><>Value
      name: kafka_$1_$2_$3
      type: GAUGE
    - pattern: kafka.(\w+)<type=(.+), name=(.+), (.+)=(.+), (.+)=(.+)><>Count
      name: kafka_$1_$2_$3_count
      type: COUNTER
      labels:
        "$4": "$5"
        "$6": "$7"
    - pattern: kafka.(\w+)<type=(.+), name=(.+), (.+)=(.*), (.+)=(.+)><>(\d+)thPercentile
      name: kafka_$1_$2_$3
      type: GAUGE
      labels:
        "$4": "$5"
        "$6": "$7"
        quantile: "0.$8"
    - pattern: kafka.(\w+)<type=(.+), name=(.+), (.+)=(.+)><>Count
      name: kafka_$1_$2_$3_count
      type: COUNTER
      labels:
        "$4": "$5"
    - pattern: kafka.(\w+)<type=(.+), name=(.+), (.+)=(.*)><>(\d+)thPercentile
      name: kafka_$1_$2_$3
      type: GAUGE
      labels:
        "$4": "$5"
        quantile: "0.$6"
    - pattern: kafka.(\w+)<type=(.+), name=(.+)><>Count
      name: kafka_$1_$2_$3_count
      type: COUNTER
    - pattern: kafka.(\w+)<type=(.+), name=(.+)><>(\d+)thPercentile
      name: kafka_$1_$2_$3
      type: GAUGE
      labels:
        quantile: "0.$4"
    - pattern: kafka.(\w+)<type=(.+), name=(.+)Percent\w*><>MeanRate
      name: kafka_$1_$2_$3_percent
      type: GAUGE
    - pattern: kafka.(\w+)<type=(.+), name=(.+)Percent\w*><>Value
      name: kafka_$1_$2_$3_percent
      type: GAUGE
    - pattern: kafka.(\w+)<type=(.+), name=(.+)Percent\w*, (.+)=(.+)><>Value
      name: kafka_$1_$2_$3_percent
      type: GAUGE
      labels:
        "$4": "$5"
---
# ============================== broker-1 ==============================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-broker-1-data
  namespace: kafka-cluster
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-broker-1
  namespace: kafka-cluster
  labels:
    app: kafka-broker-1
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kafka-broker-1
  template:
    metadata:
      labels:
        app: kafka-broker-1
    spec:
      enableServiceLinks: false
      hostname: kafka-broker-1
      initContainers:
        - name: fetch-jmx-exporter
          image: curlimages/curl:8.11.1
          command:
            - sh
            - -c
            - |
              set -e
              curl -fsSL -o /jmx/jmx_prometheus_javaagent.jar \
                https://repo1.maven.org/maven2/io/prometheus/jmx/jmx_prometheus_javaagent/1.0.1/jmx_prometheus_javaagent-1.0.1.jar
              cp /config-src/kafka-broker.yml /jmx/kafka-broker.yml
          volumeMounts:
            - name: jmx-exporter
              mountPath: /jmx
            - name: jmx-exporter-rules
              mountPath: /config-src
      containers:
        - name: kafka
          image: apache/kafka:4.3.1
          ports:
            - containerPort: 9092
            - containerPort: 19092
            - containerPort: 29093
            - containerPort: 7071
          env:
            - name: KAFKA_OPTS
              value: "-javaagent:/opt/kafka/jmx-exporter/jmx_prometheus_javaagent.jar=7071:/opt/kafka/jmx-exporter/kafka-broker.yml"
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT_HOST://localhost:9093,PLAINTEXT://kafka-broker-1.kafka-cluster.svc.cluster.local:19092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@kafka-broker-1.kafka-cluster.svc.cluster.local:29093,2@kafka-broker-2.kafka-cluster.svc.cluster.local:29093,3@kafka-broker-3.kafka-cluster.svc.cluster.local:29093"
            - name: CLUSTER_ID
              value: "K2cByfqsRAO_ktpfonxKLw"
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_OFFSETS_TOPIC_MIN_ISR
              value: "2"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "2"
            - name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR
              value: "2"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS
              value: "2000"
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
            - name: jmx-exporter
              mountPath: /opt/kafka/jmx-exporter
          readinessProbe:
            exec:
              command: ["sh", "-c", "KAFKA_OPTS= /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 12
      volumes:
        - name: kafka-data
          persistentVolumeClaim:
            claimName: kafka-broker-1-data
        - name: jmx-exporter
          emptyDir: {}
        - name: jmx-exporter-rules
          configMap:
            name: jmx-exporter-rules
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-broker-1
  namespace: kafka-cluster
spec:
  type: NodePort
  # A real, Kubernetes-specific finding: by default a Service only routes
  # to a pod once it passes its readinessProbe. All three KRaft brokers
  # need to reach EACH OTHER over this same Service (the controller port)
  # to form quorum in the first place -- but none of them can pass their
  # OWN readiness probe until quorum already exists. Docker Compose never
  # hits this, because its embedded DNS resolves a container name to its
  # IP regardless of health state. publishNotReadyAddresses lets peer
  # brokers reach each other before any of them is Ready, breaking the
  # deadlock -- confirmed the hard way (all three brokers crash-looped on
  # "Graceful shutdown timed out" until this was added).
  publishNotReadyAddresses: true
  selector:
    app: kafka-broker-1
  ports:
    - name: external
      port: 9092
      targetPort: 9092
      nodePort: 30093
    - name: internal
      port: 19092
      targetPort: 19092
    - name: controller
      port: 29093
      targetPort: 29093
    - name: jmx
      port: 7071
      targetPort: 7071
      nodePort: 30071
---
