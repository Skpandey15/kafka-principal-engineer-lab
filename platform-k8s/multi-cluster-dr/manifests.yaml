# Kubernetes equivalent of lab-19's own TwoClusterEnvironment (which,
# unlike every other lab, has no platform/ docker-compose counterpart --
# it's built and torn down per-test by Testcontainers). This gives lab-19
# the same kind of persistent, manually-explorable environment every other
# lab already has via platform-k8s/*, for manual MM2 exploration outside
# the automated test suite. Used by lab-19.
apiVersion: v1
kind: Namespace
metadata:
  name: multi-cluster-dr
---
# ============================== primary cluster ==============================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: primary-kafka-data
  namespace: multi-cluster-dr
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: primary-kafka
  namespace: multi-cluster-dr
  labels: { app: primary-kafka }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: primary-kafka } }
  template:
    metadata: { labels: { app: primary-kafka } }
    spec:
      enableServiceLinks: false
      hostname: primary-kafka
      containers:
        - name: kafka
          image: apache/kafka:4.3.1
          ports: [{ containerPort: 9092 }, { containerPort: 19092 }, { containerPort: 29093 }]
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT_HOST://localhost:19191,PLAINTEXT://primary-kafka.multi-cluster-dr.svc.cluster.local:19092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@primary-kafka:29093" }
            - { name: CLUSTER_ID, value: "K20vvThZ3aaGd9Yu7Vn1Lk" }
            - { name: KAFKA_LOG_DIRS, value: "/var/lib/kafka/data" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
          readinessProbe:
            exec: { command: ["/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"] }
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 12
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: primary-kafka-data }
---
apiVersion: v1
kind: Service
metadata:
  name: primary-kafka
  namespace: multi-cluster-dr
spec:
  type: NodePort
  selector: { app: primary-kafka }
  ports:
    - { name: external, port: 9092, targetPort: 9092, nodePort: 30191 }
    - { name: internal, port: 19092, targetPort: 19092 }
---
# ============================== secondary cluster ==============================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: secondary-kafka-data
  namespace: multi-cluster-dr
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secondary-kafka
  namespace: multi-cluster-dr
  labels: { app: secondary-kafka }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: secondary-kafka } }
  template:
    metadata: { labels: { app: secondary-kafka } }
    spec:
      enableServiceLinks: false
      hostname: secondary-kafka
      containers:
        - name: kafka
          image: apache/kafka:4.3.1
          ports: [{ containerPort: 9092 }, { containerPort: 19092 }, { containerPort: 29093 }]
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT_HOST://localhost:19192,PLAINTEXT://secondary-kafka.multi-cluster-dr.svc.cluster.local:19092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@secondary-kafka:29093" }
            - { name: CLUSTER_ID, value: "K20wwUiA4bbHe0Zv8Wo2Ml" }
            - { name: KAFKA_LOG_DIRS, value: "/var/lib/kafka/data" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
          readinessProbe:
            exec: { command: ["/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"] }
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 12
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: secondary-kafka-data }
---
apiVersion: v1
kind: Service
metadata:
  name: secondary-kafka
  namespace: multi-cluster-dr
spec:
  type: NodePort
  selector: { app: secondary-kafka }
  ports:
    - { name: external, port: 9092, targetPort: 9092, nodePort: 30192 }
    - { name: internal, port: 19092, targetPort: 19092 }
---
# ============================== MirrorMaker 2 ==============================
apiVersion: v1
kind: ConfigMap
metadata:
  name: mm2-config
  namespace: multi-cluster-dr
data:
  mm2.properties: |
    clusters = primary, secondary
    primary.bootstrap.servers = primary-kafka.multi-cluster-dr.svc.cluster.local:19092
    secondary.bootstrap.servers = secondary-kafka.multi-cluster-dr.svc.cluster.local:19092

    primary->secondary.enabled = true
    secondary->primary.enabled = false

    topics = .*
    groups = .*
    sync.topic.acls.enabled = false

    replication.factor = 1
    checkpoints.topic.replication.factor = 1
    heartbeats.topic.replication.factor = 1
    offset-syncs.topic.replication.factor = 1
    offset.storage.replication.factor = 1
    status.storage.replication.factor = 1
    config.storage.replication.factor = 1

    # Same lab-speed overrides lab-19's own TwoClusterEnvironment uses --
    # see docs/multi-cluster/KAFKA_MULTI_CLUSTER_AND_DR.md for why each
    # one is set, especially offset.lag.max (real finding: MM2's default,
    # 100, makes checkpoint translation wildly imprecise at this lab's
    # small scale).
    sync.topic.configs.interval.seconds = 5
    refresh.topics.interval.seconds = 5
    refresh.groups.interval.seconds = 5
    emit.checkpoints.interval.seconds = 5
    sync.group.offsets.enabled = true
    sync.group.offsets.interval.seconds = 5
    offset.lag.max = 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mirror-maker
  namespace: multi-cluster-dr
  labels: { app: mirror-maker }
spec:
  replicas: 1
  selector: { matchLabels: { app: mirror-maker } }
  template:
    metadata: { labels: { app: mirror-maker } }
    spec:
      enableServiceLinks: false
      hostname: mirror-maker
      containers:
        - name: mirror-maker
          image: apache/kafka:4.3.1
          command: ["/opt/kafka/bin/connect-mirror-maker.sh"]
          args: ["/opt/kafka/config/mm2.properties"]
          volumeMounts:
            - { name: config, mountPath: /opt/kafka/config/mm2.properties, subPath: mm2.properties }
          # A real finding: unlike platform-k8s/kafka-connect's full
          # connect-distributed.sh worker, connect-mirror-maker.sh's
          # dedicated-mode herder does not bind a REST API by default --
          # there is no cheap "is it up" endpoint to probe. Real liveness
          # evidence is in the logs instead (MirrorSourceConnector /
          # MirrorHeartbeatConnector committing offsets, confirmed the
          # hard way while validating this manifest) -- no readinessProbe
          # here, matching lab-19's own TwoClusterEnvironment, which
          # waits on the two Kafka clusters' health only, not MM2's.
      volumes:
        - name: config
          configMap: { name: mm2-config }
