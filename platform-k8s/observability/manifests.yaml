# Kubernetes equivalent of platform/observability/docker-compose.yml --
# Prometheus + kafka-exporter + Grafana. Prerequisite: platform-k8s/kafka-cluster
# must already be applied (with its own JMX exporter agents). Used by lab-15.
apiVersion: v1
kind: Namespace
metadata:
  name: observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: "kafka-brokers"
        static_configs:
          - targets:
              - "kafka-broker-1.kafka-cluster.svc.cluster.local:7071"
              - "kafka-broker-2.kafka-cluster.svc.cluster.local:7072"
              - "kafka-broker-3.kafka-cluster.svc.cluster.local:7073"
            labels:
              cluster: "wp07-3-broker-cluster"
      - job_name: "kafka-consumer-lag"
        static_configs:
          - targets:
              - "kafka-exporter.observability.svc.cluster.local:9308"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: observability
  labels: { app: prometheus }
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata: { labels: { app: prometheus } }
    spec:
      enableServiceLinks: false
      hostname: observability-prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.14.0
          ports: [{ containerPort: 9090 }]
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus/prometheus.yml, subPath: prometheus.yml }
          readinessProbe:
            httpGet: { path: /-/ready, port: 9090 }
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
      volumes:
        - name: config
          configMap: { name: prometheus-config }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: observability
spec:
  type: NodePort
  selector: { app: prometheus }
  ports: [{ port: 9090, targetPort: 9090, nodePort: 30090 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter
  namespace: observability
  labels: { app: kafka-exporter }
spec:
  replicas: 1
  selector: { matchLabels: { app: kafka-exporter } }
  template:
    metadata: { labels: { app: kafka-exporter } }
    spec:
      enableServiceLinks: false
      hostname: observability-kafka-exporter
      containers:
        - name: kafka-exporter
          image: danielqsj/kafka-exporter:v1.10.0
          args:
            - "--kafka.server=kafka-broker-1.kafka-cluster.svc.cluster.local:19092"
            - "--kafka.server=kafka-broker-2.kafka-cluster.svc.cluster.local:19092"
            - "--kafka.server=kafka-broker-3.kafka-cluster.svc.cluster.local:19092"
          ports: [{ containerPort: 9308 }]
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-exporter
  namespace: observability
spec:
  type: NodePort
  selector: { app: kafka-exporter }
  ports: [{ port: 9308, targetPort: 9308, nodePort: 30308 }]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning-datasources
  namespace: observability
data:
  prometheus.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.observability.svc.cluster.local:9090
        isDefault: true
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning-dashboards
  namespace: observability
data:
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: "WP-16 Kafka dashboards"
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-kafka-overview
  namespace: observability
data:
  kafka-overview.json: |
    {
      "title": "Kafka Overview (WP-16)",
      "uid": "wp16-kafka-overview",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": { "from": "now-15m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Consumer group lag by partition",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            { "expr": "kafka_consumergroup_lag", "legendFormat": "{{consumergroup}} / {{topic}} / p{{partition}}", "refId": "A" }
          ]
        },
        {
          "id": 2,
          "title": "Broker bytes-in per second (by topic)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            { "expr": "rate(kafka_server_brokertopicmetrics_bytesin_total{topic!=\"\"}[1m])", "legendFormat": "{{topic}} @ {{instance}}", "refId": "A" }
          ]
        },
        {
          "id": 3,
          "title": "Under-replicated partitions",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            { "expr": "kafka_server_replicamanager_underreplicatedpartitions", "legendFormat": "{{instance}}", "refId": "A" }
          ]
        },
        {
          "id": 4,
          "title": "Request handler idle percent (lower = busier broker)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            { "expr": "kafka_server_kafkarequesthandlerpool_requesthandleravgidle_percent", "legendFormat": "{{instance}}", "refId": "A" }
          ]
        },
        {
          "id": 5,
          "title": "Per-partition current offset (throughput / hot-partition skew)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 16 },
          "targets": [
            { "expr": "kafka_topic_partition_current_offset", "legendFormat": "{{topic}} / p{{partition}}", "refId": "A" }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability
  labels: { app: grafana }
spec:
  replicas: 1
  selector: { matchLabels: { app: grafana } }
  template:
    metadata: { labels: { app: grafana } }
    spec:
      enableServiceLinks: false
      hostname: observability-grafana
      containers:
        - name: grafana
          image: grafana/grafana:13.2.2
          ports: [{ containerPort: 3000 }]
          env:
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: "Admin" }
            - { name: GF_AUTH_DISABLE_LOGIN_FORM, value: "true" }
          volumeMounts:
            - { name: datasources, mountPath: /etc/grafana/provisioning/datasources }
            - { name: dashboard-provider, mountPath: /etc/grafana/provisioning/dashboards }
            - { name: dashboard-json, mountPath: /var/lib/grafana/dashboards }
      volumes:
        - name: datasources
          configMap: { name: grafana-provisioning-datasources }
        - name: dashboard-provider
          configMap: { name: grafana-provisioning-dashboards }
        - name: dashboard-json
          configMap: { name: grafana-dashboard-kafka-overview }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: observability
spec:
  type: NodePort
  selector: { app: grafana }
  ports: [{ port: 3000, targetPort: 3000, nodePort: 30300 }]
