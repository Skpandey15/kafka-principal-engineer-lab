# ============================== broker-1 (node id 4) ==============================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kraft-quorum-broker-1-data
  namespace: kraft-quorum
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kraft-quorum-broker-1
  namespace: kraft-quorum
  labels: { app: kraft-quorum-broker-1 }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: kraft-quorum-broker-1 } }
  template:
    metadata: { labels: { app: kraft-quorum-broker-1 } }
    spec:
      enableServiceLinks: false
      hostname: kraft-quorum-broker-1
      containers:
        - name: kafka
          image: apache/kafka:4.3.1
          ports: [{ containerPort: 9092 }, { containerPort: 19092 }]
          env:
            - { name: KAFKA_NODE_ID, value: "4" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT_HOST://:9092,PLAINTEXT://:19092" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT_HOST://localhost:9096,PLAINTEXT://kraft-quorum-broker-1.kraft-quorum.svc.cluster.local:19092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@kafka-controller-1.kraft-quorum.svc.cluster.local:29093,2@kafka-controller-2.kraft-quorum.svc.cluster.local:29093,3@kafka-controller-3.kraft-quorum.svc.cluster.local:29093" }
            - { name: CLUSTER_ID, value: "6Zy-q9GlR3u9dQkH6Aj_4A" }
            - { name: KAFKA_LOG_DIRS, value: "/var/lib/kafka/data" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "3" }
            - { name: KAFKA_OFFSETS_TOPIC_MIN_ISR, value: "2" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "3" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "2" }
            - { name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR, value: "3" }
            - { name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR, value: "2" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
          readinessProbe:
            exec: { command: ["/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"] }
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 12
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: kraft-quorum-broker-1-data }
---
apiVersion: v1
kind: Service
metadata:
  name: kraft-quorum-broker-1
  namespace: kraft-quorum
spec:
  type: NodePort
  publishNotReadyAddresses: true
  selector: { app: kraft-quorum-broker-1 }
  ports:
    - { name: external, port: 9092, targetPort: 9092, nodePort: 30096 }
    - { name: internal, port: 19092, targetPort: 19092 }
---
