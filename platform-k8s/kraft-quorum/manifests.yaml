# Kubernetes equivalent of platform/kraft-quorum/docker-compose.yml -- 3
# controller-only voters + 3 broker-only nodes (dedicated-role topology, for
# lab-07). See platform/kraft-quorum/README.md for the full reasoning behind
# every KAFKA_* value -- unchanged here. Controllers get NO NodePort, exactly
# like docker-compose never publishes a host port for them -- see that
# README's "Why controllers have no host port" note.
apiVersion: v1
kind: Namespace
metadata:
  name: kraft-quorum
---
# ============================== controller-1 ==============================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-controller-1-data
  namespace: kraft-quorum
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 512Mi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-controller-1
  namespace: kraft-quorum
  labels: { app: kafka-controller-1 }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: kafka-controller-1 } }
  template:
    metadata: { labels: { app: kafka-controller-1 } }
    spec:
      enableServiceLinks: false
      hostname: kafka-controller-1
      containers:
        - name: kafka
          image: apache/kafka:4.3.1
          ports: [{ containerPort: 29093 }]
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "controller" }
            - { name: KAFKA_LISTENERS, value: "CONTROLLER://:29093" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@kafka-controller-1.kraft-quorum.svc.cluster.local:29093,2@kafka-controller-2.kraft-quorum.svc.cluster.local:29093,3@kafka-controller-3.kraft-quorum.svc.cluster.local:29093" }
            - { name: CLUSTER_ID, value: "6Zy-q9GlR3u9dQkH6Aj_4A" }
            - { name: KAFKA_LOG_DIRS, value: "/var/lib/kafka/data" }
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: kafka-controller-1-data }
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-controller-1
  namespace: kraft-quorum
spec:
  # No client-facing port at all -- matches docker-compose never publishing
  # one for a controller-only node. publishNotReadyAddresses: true is the
  # same fix kafka-cluster's Services needed (see that manifest's comment):
  # the three controllers must reach each other to form quorum before any
  # of them could pass a readiness check, if one were ever added later.
  publishNotReadyAddresses: true
  selector: { app: kafka-controller-1 }
  ports: [{ name: controller, port: 29093, targetPort: 29093 }]
---
